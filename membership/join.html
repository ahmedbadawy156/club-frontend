<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://*.execute-api.localhost.floci.io:4566; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Request membership · Campus Club</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script type="module" src="join.js"></script>
</head>
<body>
  <main class="narrow">
    <h1>Request membership</h1>
    <p class="lead">An officer reviews every request. You can sign in once it is approved.</p>

    <div id="message"></div>

    <form id="join-form" class="card" novalidate>
      <label>
        Full name
        <input type="text" name="fullName" autocomplete="name" required minlength="2" maxlength="100">
        <span class="hint" id="fullName-error"></span>
      </label>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required maxlength="254">
        <span class="hint" id="email-error"></span>
      </label>
      <label>
        Password
        <span class="hint">8 to 72 characters. You will use it to sign in after approval.</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72">
        <span class="hint" id="password-error"></span>
      </label>
      <label>
        Repeat password
        <input type="password" name="confirm" autocomplete="new-password" required>
        <span class="hint" id="confirm-error"></span>
      </label>
      <button class="button" type="submit">Send request</button>
    </form>

    <p class="muted">Already approved? <a href="login.html">Sign in</a>.</p>
  </main>
</body>
</html>
