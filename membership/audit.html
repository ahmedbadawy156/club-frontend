<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:54321 https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Audit log · Campus Club</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script type="module" src="audit.js"></script>
</head>
<body>
  <main>
    <h1>Audit log</h1>
    <p class="lead">Approvals, rejections, role changes, failed sign-ins and lockouts, newest first. Entries cannot be edited or deleted.</p>

    <div class="toolbar">
      <label>
        Event type
        <select id="type">
          <option value="">All events</option>
          <option value="membership_approved">Membership approved</option>
          <option value="membership_rejected">Membership rejected</option>
          <option value="role_changed">Role changed</option>
          <option value="login_failure">Failed sign-in</option>
          <option value="account_locked">Account locked</option>
        </select>
      </label>
    </div>

    <div id="message"></div>
    <div class="table-wrap" id="list"></div>
    <div class="pager" id="pager"></div>
  </main>
</body>
</html>
