<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://*.execute-api.localhost.floci.io:4566; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Sign in · Campus Club</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script type="module" src="login.js"></script>
</head>
<body>
  <main class="narrow">
    <h1>Sign in</h1>
    <p class="lead">For approved club members and officers.</p>

    <div id="message"></div>

    <form id="login-form" class="card" novalidate>
      <label>
        Email
        <input type="email" name="email" autocomplete="username" required maxlength="254">
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required maxlength="72">
      </label>
      <button class="button" type="submit">Sign in</button>
    </form>

    <p class="muted">Not a member yet? <a href="join.html">Request membership</a>.</p>
  </main>
</body>
</html>
