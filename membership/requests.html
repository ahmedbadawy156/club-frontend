<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://*.execute-api.localhost.floci.io:4566; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Membership requests · Campus Club</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script type="module" src="requests.js"></script>
</head>
<body>
  <main>
    <h1>Membership requests</h1>
    <p class="lead">Approve or reject people who asked to join. Each request is decided once.</p>

    <div class="tabs" role="group" aria-label="Request status">
      <button class="tab" type="button" data-status="pending" aria-pressed="true">Pending</button>
      <button class="tab" type="button" data-status="approved" aria-pressed="false">Approved</button>
      <button class="tab" type="button" data-status="rejected" aria-pressed="false">Rejected</button>
    </div>

    <div id="message"></div>
    <div class="table-wrap" id="list"></div>
  </main>
</body>
</html>
